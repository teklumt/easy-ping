version: 2
updates:
  # Keeps the SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    groups:
      # react and react-dom refuse to run at different versions, so they only move together.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Majors stay out of the groups and arrive one per PR, so one breaking change cannot
      # block every routine update.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
