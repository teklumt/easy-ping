name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  # id-token: write goes back here together with `publish:` below, once npm
  # trusted publishing is enabled. Until then it is an unused OIDC grant.

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # See ci.yml: Mongo needs a replica-set command override, which a
      # service container cannot express.
      - run: docker compose up -d --wait

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # pnpm 11 requires >= 22.13 (it loads node:sqlite).
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The gates run here as well as in CI. CI runs in parallel, so without
      # this a release could go out from a commit whose tests are still red.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Only maintains the version PR. `publish` is deliberately absent:
      #
      # npm trusted publishing (OIDC) cannot create a package that does not
      # exist yet — a trusted publisher is configured on an existing package,
      # so there is nothing to attach it to. The registry rejects that first
      # PUT as E404, which reads like "name taken" and is not.
      #
      # The first release must therefore be published by hand:
      #
      #   npm login
      #   pnpm --filter easy-ping publish --access public
      #
      # then enable trusted publishing on npmjs.com for this repo and workflow
      # and re-add `publish: pnpm changeset publish` below.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
