name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  # Mints the short-lived OIDC token npm exchanges for publish rights. No npm
  # token is stored anywhere; the trust is configured on npmjs.com against
  # this repository and this workflow file.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # See ci.yml: Mongo needs a replica-set command override, which a
      # service container cannot express.
      - run: docker compose up -d --wait

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # pnpm 11 requires >= 22.13 (it loads node:sqlite); trusted publishing
          # needs >= 22.14, which the 22 line satisfies.
          node-version: 22
          cache: pnpm
          # No `registry-url`. It makes setup-node write an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}` and set NODE_AUTH_TOKEN to its dummy
          # placeholder, so pnpm sends that garbage as a bearer token and never
          # reaches the OIDC exchange. npm masks the rejection as E404, which is
          # what killed the 0.5.0 publish. registry.npmjs.org is the default
          # anyway, so nothing is lost by leaving it out.

      - run: pnpm install --frozen-lockfile

      # The gates run here as well as in CI. CI runs in parallel, so without
      # this a release could go out from a commit whose tests are still red.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Maintains the version PR, and on merge publishes and tags.
      #
      # `publish` was absent until 0.4.0 because npm trusted publishing cannot
      # create a package that does not exist yet — a trusted publisher is
      # configured on an existing package, so the first PUT is rejected as
      # E404, which reads like "name taken" and is not. easy-ping exists now
      # and a trusted publisher is configured, so OIDC takes over from here.
      #
      # This also tags the release and opens a GitHub Release from the
      # changelog, which is what puts a version in the repo sidebar.
      #
      # v2 of the action is the one that understands @changesets/cli 3. v1
      # detected published packages by grepping "New tag:" lines that cli 3 no
      # longer prints, which is why 0.6.1 and 0.7.0 reached npm but got no git
      # tag and no GitHub Release. v2 reads the CHANGESETS_OUTPUT file instead,
      # and pushes commits and tags through the GitHub API (signed) by default.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: "chore: release"
          pr-title: "chore: release"
          create-github-releases: true
          # v2 reads the token from this input; the GITHUB_TOKEN env var is ignored.
          github-token: ${{ secrets.GITHUB_TOKEN }}
