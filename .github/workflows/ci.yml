name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm 11 requires >= 22.13 (it loads node:sqlite). This is the toolchain
  # version, not the runtime floor the library supports — see runtime-floor.
  NODE_VERSION: 22

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker compose rather than `services:`, because Mongo needs a command
      # override to run as a replica set and a service container cannot set
      # one. It also keeps CI and a local run on the same definition.
      - run: docker compose up -d --wait

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm audit ignores --filter and reads the whole lockfile, so this also covers the
      # examples. --ignore-unfixable skips advisories with no patched version yet; once one
      # ships, pnpm stops treating it as unfixable and this starts failing on it again.
      - run: pnpm --filter easy-ping audit --prod --audit-level high --ignore-unfixable

      - run: pnpm lint
      # The committed agent skill must match docs/src/lib; the docs build regenerates it, so
      # this runs first.
      - run: node docs/scripts/generate-skill.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm type-budget

  runtime-floor:
    # Guards `engines.node`. The suite runs on the toolchain version, so
    # without this the lowest supported runtime is never actually exercised —
    # which is how the package came to claim Node 18 support it did not have.
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Install and build on the toolchain version; pnpm cannot run on 20.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Then drop to the target runtime and exercise the built bundles.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: node packages/easy-ping/scripts/check-node-floor.mjs
